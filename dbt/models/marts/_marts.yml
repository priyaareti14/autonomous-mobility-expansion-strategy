  - name: dim_feature
    description: >
      Machine-readable feature dictionary (one row per feature x mode): component, unit, direction,
      transformation, source, vintage, limitation and production status. No weights.
    tests:
      - unique_combination_of_columns: {arguments: {combination_of_columns: [feature_id, mode]}}
      - unique_combination_of_columns: {arguments: {combination_of_columns: [feature_name, mode]}}

version: 2

models:
  - name: int_regulatory__market_state_evidence
    description: >
      Verified regulatory evidence behind every market (Phase 7 input). Grain: one row per market x mode x
      ACTIVE_CANDIDATE legal dimension x state of BRG_MARKET_STATE (51 market-states x 7 = 357). Applies the
      Phase 6.5b base-model eligibility rule to every mode (VERIFIED_PRIMARY and MEDIUM/HIGH confidence) and
      classes each state row as VERIFIED_FAVORABLE, VERIFIED_NOT_FAVORABLE, UNKNOWN_OR_LOW_CONFIDENCE or
      NOT_APPLICABLE. Shares and classes only: no score.
    tests:
      - row_count_equals: {arguments: {expected: 357}}
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [market_id, mode, legal_dimension, state_usps]
    columns:
      - name: market_id
        tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_market'), field: market_id}}
      - name: state_population_share
        tests:
          - not_null
          - values_between: {arguments: {min_value: 0, max_value: 1}}
      - name: base_eligible_flag
        description: "TRUE only for VERIFIED_PRIMARY evidence with MEDIUM or HIGH confidence (Phase 6.5b rule)."
        tests: [not_null]
      - name: base_evidence_class
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [VERIFIED_FAVORABLE, VERIFIED_NOT_FAVORABLE, UNKNOWN_OR_LOW_CONFIDENCE, NOT_APPLICABLE]
      - name: not_favorable_reason
        description: "Why a verified record is not favorable: ABSENCE (silence in state law, A-043), EXPLICIT_NOT_FAVORABLE, UNCLEAR or SCOPE_LIMITED (A-046)."
        tests:
          - accepted_values:
              arguments:
                values: [ABSENCE, EXPLICIT_NOT_FAVORABLE, UNCLEAR, SCOPE_LIMITED]

seeds:
  - name: regulatory_state_evidence
    description: >
      State-level records of the 7 ACTIVE_CANDIDATE regulatory dimensions, projected from
      evidence/regulatory_evidence.csv by scripts/build_regulatory_seed.py (do not edit by hand;
      --check proves it matches the source). Deployment evidence is never included.
    tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [mode, legal_dimension, state_usps]
    columns:
      - name: evidence_id
        tests: [not_null, unique]
      - name: confidence
        tests:
          - accepted_values: {arguments: {values: [HIGH, MEDIUM, LOW]}}
      - name: verification_status
        tests:
          - accepted_values: {arguments: {values: [VERIFIED_PRIMARY, PRIMARY_CITED_NOT_RETRIEVED, SECONDARY_ONLY]}}
  - name: regulatory_feature_contract
    description: "Copy of config/regulatory_feature_contract.csv (definitions only), generated by scripts/build_regulatory_seed.py."
    columns:
      - name: feature_id
        tests: [not_null, unique]
  - name: regulatory_scope_adjustments
    description: >
      Documented base-model treatments of individual evidence records. One row: SW-NV-01 (Nevada's PDD statute is
      campus-only, A-046) counts as not favorable in the base model; the evidence code itself is unchanged.
    columns:
      - name: evidence_id
        tests:
          - not_null
          - unique
          - relationships: {arguments: {to: ref('regulatory_state_evidence'), field: evidence_id}}

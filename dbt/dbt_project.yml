# Autonomous Mobility Expansion Strategy: dbt transformation layer (Phase 4) and
# production feature layer (Phase 6)
#
# RAW (Phase 3 ingestion) -> STAGING -> INTERMEDIATE -> CORE -> ANALYTICS
# Every layer targets an EXISTING schema (see macros/generate_schema_name.sql).
# The dbt role AM_TRANSFORMER deliberately has no CREATE SCHEMA privilege.

name: autonomous_mobility
version: "0.6.0"

# Approved Phase 5 mapping rules (docs/mapping_methodology.md, docs/production_feature_layer.md).
# Rule constants live here, once, so models and tests cannot drift apart.
vars:
  # W5 weather station rule
  w5_plcd_max_km: 25                 # a PLCD station (NOAA HOMR) is preferred only within this distance of the PW centre
  w5_station_class_as_of: "2020-12-31"   # station class (HOMR TYPE) taken on the last day of the 1991-2020 normals
  w5_snow_fallback_max_km: 50        # snow may come from another station only within this distance
  w5_core_flags: ["S", "R"]          # NCEI completeness flags that qualify a core element (gap-filled normals)
  w5_snow_flags: ["S", "P"]          # snow normals are never gap-filled: S or P (>= 10 years) qualify
  # A4 airport diagnostic (not a production feature)
  a4_radius_km: 80
config-version: 2
profile: autonomous_mobility

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

flags:
  send_anonymous_usage_stats: false

models:
  autonomous_mobility:
    # Model and column descriptions become Snowflake comments, so Snowsight and
    # Power BI users see the same documentation as dbt docs.
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: STAGING
      +materialized: view        # source-level cleanup only; RAW stays the single copy
    intermediate:
      +schema: INTERMEDIATE
      +materialized: table       # reusable bridges and candidate relationship tables
    core:
      +schema: CORE
      +materialized: table       # dimensional layer with documented grain
    marts:
      +schema: ANALYTICS
      +materialized: table       # decision-ready, one row per market

seeds:
  autonomous_mobility:
    +schema: INTERMEDIATE
    +persist_docs:
      relation: true
      columns: true
    frozen_market_universe:
      +column_types:
        market_rank: number(2,0)
        market_id: varchar(5)
        cbsa_name: varchar
        population_2025: number(12,0)
    # Phase 6 production feature contract, generated by scripts/build_feature_contract.py
    feature_contract:
      +column_types:
        active_pre_regulation_flag: boolean
